<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.SubjectTitle}}</title>
</head>
<body style="margin:0;padding:0;background:#0f0f0f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0f0f0f;padding:32px 16px;">
<tr><td align="center">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#1a1a1a;border-radius:16px;border:1px solid #2a2a2a;">
<tr><td style="padding:32px 28px 8px;text-align:center;">
<span style="font-size:20px;font-weight:600;color:#ffffff;letter-spacing:-0.02em;">WiChat</span>
</td></tr>
<tr><td style="padding:8px 28px 4px;text-align:center;">
<h1 style="margin:0;font-size:22px;font-weight:600;color:#ffffff;">{{.Headline}}</h1>
</td></tr>
<tr><td style="padding:12px 28px 8px;text-align:center;">
<p style="margin:0;font-size:14px;line-height:1.5;color:#a3a3a3;">Hai {{.DisplayName}}, {{.Lead}}</p>
</td></tr>
<tr><td style="padding:20px 28px;text-align:center;">
<div style="display:inline-block;padding:16px 24px;background:#262626;border-radius:12px;border:1px solid #3a3a3a;font-size:28px;font-weight:700;letter-spacing:0.35em;color:#ffffff;font-family:ui-monospace,monospace;">{{.CodeFormatted}}</div>
</td></tr>
<tr><td style="padding:8px 28px 28px;text-align:center;">
<p style="margin:0;font-size:12px;line-height:1.5;color:#737373;">Jika Anda tidak meminta ini, abaikan email ini.</p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
