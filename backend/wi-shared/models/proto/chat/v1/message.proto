syntax = "proto3";

package chat.v1;

option go_package = "github.com/wichat/wichat/backend/wi-shared/models/gen/chat/v1;chatv1";

// MessageService stores, lists, updates, reacts to, and pins channel messages.
service MessageService {
  rpc ListChannelMessages(ListChannelMessagesRequest) returns (ListChannelMessagesResponse);
  rpc CreateChannelMessage(CreateChannelMessageRequest) returns (CreateChannelMessageResponse);
  rpc UpdateChannelMessage(UpdateChannelMessageRequest) returns (UpdateChannelMessageResponse);
  rpc DeleteChannelMessage(DeleteChannelMessageRequest) returns (DeleteChannelMessageResponse);
  rpc ToggleMessageReaction(ToggleMessageReactionRequest) returns (ToggleMessageReactionResponse);
  rpc SetChannelMessagePinned(SetChannelMessagePinnedRequest) returns (SetChannelMessagePinnedResponse);
  rpc ListPinnedChannelMessages(ListPinnedChannelMessagesRequest) returns (ListPinnedChannelMessagesResponse);
  rpc UploadChannelAttachment(UploadChannelAttachmentRequest) returns (UploadChannelAttachmentResponse);
}

message ListChannelMessagesRequest {
  string access_token = 1;
  string group_id = 2;
  string channel_id = 3;
  int32 limit = 4;
  string before_created_at = 5;
}

message ListChannelMessagesResponse {
  repeated MessageSummary messages = 1;
}

message CreateChannelMessageRequest {
  string access_token = 1;
  string group_id = 2;
  string channel_id = 3;
  string body = 4;
  string reply_to_id = 5;
}

message CreateChannelMessageResponse {
  MessageSummary message = 1;
}

message UpdateChannelMessageRequest {
  string access_token = 1;
  string group_id = 2;
  string channel_id = 3;
  string message_id = 4;
  string body = 5;
}

message UpdateChannelMessageResponse {
  MessageSummary message = 1;
}

message DeleteChannelMessageRequest {
  string access_token = 1;
  string group_id = 2;
  string channel_id = 3;
  string message_id = 4;
}

message DeleteChannelMessageResponse {
  bool ok = 1;
}

message ToggleMessageReactionRequest {
  string access_token = 1;
  string group_id = 2;
  string channel_id = 3;
  string message_id = 4;
  string emoji = 5;
}

message ToggleMessageReactionResponse {
  repeated MessageReactionSummary reactions = 1;
}

message SetChannelMessagePinnedRequest {
  string access_token = 1;
  string group_id = 2;
  string channel_id = 3;
  string message_id = 4;
  bool pinned = 5;
}

message SetChannelMessagePinnedResponse {
  MessageSummary message = 1;
}

message ListPinnedChannelMessagesRequest {
  string access_token = 1;
  string group_id = 2;
  string channel_id = 3;
}

message ListPinnedChannelMessagesResponse {
  repeated MessageSummary messages = 1;
}

message MessageReplyPreview {
  string id = 1;
  string author_id = 2;
  string author_display_name = 3;
  string body_preview = 4;
}

message MessageReactionSummary {
  string emoji = 1;
  int32 count = 2;
  repeated string user_ids = 3;
}

message MessageSummary {
  string id = 1;
  string author_id = 2;
  string author_display_name = 3;
  string body = 4;
  string created_at = 5;
  bool mine = 6;
  string author_avatar_url = 7;
  string edited_at = 8;
  bool is_pinned = 9;
  MessageReplyPreview reply_to = 10;
  repeated MessageReactionSummary reactions = 11;
}

message UploadChannelAttachmentRequest {
  string access_token = 1;
  string group_id = 2;
  string channel_id = 3;
  string filename = 4;
  string content_type = 5;
  bytes data = 6;
}

message MessageAttachment {
  string id = 1;
  string url = 2;
  string filename = 3;
  string content_type = 4;
  int64 size_bytes = 5;
  bool is_image = 6;
}

message UploadChannelAttachmentResponse {
  MessageAttachment attachment = 1;
}
