syntax = "proto3";

package chat.v1;

option go_package = "github.com/wichat/wichat/backend/wi-shared/models/gen/chat/v1;chatv1";

// SearchService runs group-scoped message search against the Elasticsearch index.
service SearchService {
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);
  rpc SearchFiles(SearchFilesRequest) returns (SearchFilesResponse);
  rpc ListGroupMentions(ListGroupMentionsRequest) returns (ListGroupMentionsResponse);
  rpc MarkGroupMentionsRead(MarkGroupMentionsReadRequest) returns (MarkGroupMentionsReadResponse);
  rpc CountGroupMentionsUnread(CountGroupMentionsUnreadRequest) returns (CountGroupMentionsUnreadResponse);
}

message MessageSearchHit {
  string message_id = 1;
  string group_id = 2;
  string channel_id = 3;
  string body_preview = 4;
  string author_display_name = 5;
  string created_at = 6;
}

message SearchMessagesRequest {
  string access_token = 1;
  string group_id = 2;
  string query = 3;
  int32 limit = 4;
}

message SearchMessagesResponse {
  repeated MessageSearchHit hits = 1;
}

message FileSearchHit {
  string attachment_id = 1;
  string message_id = 2;
  string group_id = 3;
  string channel_id = 4;
  string filename = 5;
  string content_type = 6;
  string created_at = 7;
}

message SearchFilesRequest {
  string access_token = 1;
  string group_id = 2;
  string query = 3;
  int32 limit = 4;
  bool images_only = 5;
}

message SearchFilesResponse {
  repeated FileSearchHit hits = 1;
}

message GroupMentionHit {
  string message_id = 1;
  string channel_id = 2;
  string channel_name = 3;
  string channel_type = 4;
  string author_display_name = 5;
  string body_preview = 6;
  string created_at = 7;
  bool is_unread = 8;
}

message ListGroupMentionsRequest {
  string access_token = 1;
  string group_id = 2;
  int32 limit = 3;
  string cursor = 4;
  string kind = 5;
}

message ListGroupMentionsResponse {
  repeated GroupMentionHit hits = 1;
  string next_cursor = 2;
}

message MarkGroupMentionsReadRequest {
  string access_token = 1;
  string group_id = 2;
  repeated string message_ids = 3;
}

message MarkGroupMentionsReadResponse {}

message CountGroupMentionsUnreadRequest {
  string access_token = 1;
  string group_id = 2;
}

message CountGroupMentionsUnreadResponse {
  int32 count = 1;
}