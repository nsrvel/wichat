syntax = "proto3";

package user.v1;

option go_package = "github.com/wichat/wichat/backend/wi-shared/models/gen/user/v1;userv1";

// ChannelCategoryService handles channel category lifecycle, ordering, and permission overrides within a workspace.
service ChannelCategoryService {
  // CreateChannelCategory creates a new channel category in a group.
  rpc CreateChannelCategory(CreateChannelCategoryRequest) returns (CreateChannelCategoryResponse);
  // UpdateChannelCategory updates a channel category name or privacy in a group.
  rpc UpdateChannelCategory(UpdateChannelCategoryRequest) returns (UpdateChannelCategoryResponse);
  // DeleteChannelCategory deletes a channel category and uncategorizes its channels.
  rpc DeleteChannelCategory(DeleteChannelCategoryRequest) returns (DeleteChannelCategoryResponse);
  // ListChannelCategoryPermissions returns role and member permission overrides for a category.
  rpc ListChannelCategoryPermissions(ListChannelCategoryPermissionsRequest) returns (ListChannelCategoryPermissionsResponse);
  // UpsertChannelCategoryPermission sets allow/deny permission overrides for a role or member on a category.
  rpc UpsertChannelCategoryPermission(UpsertChannelCategoryPermissionRequest) returns (UpsertChannelCategoryPermissionResponse);
  // DeleteChannelCategoryPermission removes a role or member permission override from a category.
  rpc DeleteChannelCategoryPermission(DeleteChannelCategoryPermissionRequest) returns (DeleteChannelCategoryPermissionResponse);
  // ReorderChannelCategories updates category display positions in a group.
  rpc ReorderChannelCategories(ReorderChannelCategoriesRequest) returns (ReorderChannelCategoriesResponse);
}

// ChannelCategory is category metadata for grouping channels in the sidebar.
message ChannelCategory {
  string id = 1;
  string name = 2;
  bool is_private = 3;
  int32 position = 4;
}

message CreateChannelCategoryRequest {
  string access_token = 1;
  string group_id = 2;
  string name = 3;
  bool is_private = 4;
}

message CreateChannelCategoryResponse {
  ChannelCategory category = 1;
}

message UpdateChannelCategoryRequest {
  string access_token = 1;
  string group_id = 2;
  string category_id = 3;
  optional string name = 4;
  optional bool is_private = 5;
}

message UpdateChannelCategoryResponse {
  ChannelCategory category = 1;
}

message DeleteChannelCategoryRequest {
  string access_token = 1;
  string group_id = 2;
  string category_id = 3;
}

message DeleteChannelCategoryResponse {
  bool ok = 1;
}

message ChannelCategoryPermissionOverride {
  string target_type = 1;
  string target_id = 2;
  string target_name = 3;
  string target_color = 4;
  string target_avatar_url = 5;
  bool is_everyone = 6;
  repeated string allow_permissions = 7;
  repeated string deny_permissions = 8;
}

message ListChannelCategoryPermissionsRequest {
  string access_token = 1;
  string group_id = 2;
  string category_id = 3;
}

message ListChannelCategoryPermissionsResponse {
  repeated ChannelCategoryPermissionOverride overrides = 1;
}

message UpsertChannelCategoryPermissionRequest {
  string access_token = 1;
  string group_id = 2;
  string category_id = 3;
  string target_type = 4;
  string target_id = 5;
  repeated string allow_permissions = 6;
  repeated string deny_permissions = 7;
}

message UpsertChannelCategoryPermissionResponse {
  ChannelCategoryPermissionOverride override = 1;
}

message DeleteChannelCategoryPermissionRequest {
  string access_token = 1;
  string group_id = 2;
  string category_id = 3;
  string target_type = 4;
  string target_id = 5;
}

message DeleteChannelCategoryPermissionResponse {
  bool ok = 1;
}

message ReorderChannelCategoriesRequest {
  string access_token = 1;
  string group_id = 2;
  repeated string category_ids = 3;
}

message ReorderChannelCategoriesResponse {
  bool ok = 1;
}
