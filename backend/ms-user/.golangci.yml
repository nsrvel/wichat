version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003 # WiChat pkg naming: kebab-case dir → camelCase package (authPb, authHttp, …)
    gosec:
      excludes:
        - G104
        - G101

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
