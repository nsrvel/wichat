name: CI

on:
  push:
    branches: [release, main]
  pull_request:
    branches: [release, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-baseline:
    name: Repository baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Required project files
        run: |
          test -f README.md
          test -f LICENSE
          test -f docs/architecture/wichat-system-design.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md

      - name: No accidental env files
        run: |
          if git ls-files | grep -E '^\.env$|^\.env\.' | grep -v '.env.example'; then
            echo "Refusing to ship .env secrets"
            exit 1
          fi

  go-lint:
    name: Go lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [wi-shared, ms-user, api-gateway]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: backend/${{ matrix.module }}/go.sum
      - name: golangci-lint
        working-directory: backend/${{ matrix.module }}
        run: make lint

  proto-lint:
    name: Proto lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: buf lint
        working-directory: backend/wi-shared
        run: make buf-lint

  go-test:
    name: Go tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: [go-lint, proto-lint]
    strategy:
      fail-fast: false
      matrix:
        module: [wi-shared, ms-user, api-gateway]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: backend/${{ matrix.module }}/go.sum
      - name: Test module
        working-directory: backend/${{ matrix.module }}
        run: make test

  web-client:
    name: Web client (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Copy env for build
        run: cp frontend/apps/web/.env.example frontend/apps/web/.env.local
      - name: check
        working-directory: frontend
        run: pnpm --filter web-client check
