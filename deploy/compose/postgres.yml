services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wichat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wichat}
      POSTGRES_DB: ${POSTGRES_DB:-wichat}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wichat-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wichat -d wichat"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wichat-postgres:
