global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ms-user
    static_configs:
      - targets: ["host.docker.internal:3001"]
        labels:
          service: ms-user
  - job_name: api-gateway
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          service: api-gateway
