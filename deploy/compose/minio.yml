services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wichat
      MINIO_ROOT_PASSWORD: wichatdev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - wichat-minio:/data

volumes:
  wichat-minio:
